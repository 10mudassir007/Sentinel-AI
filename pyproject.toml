[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "sentinel-ai"
version = "1.0.0"
description = "Automated video incident-detection platform — motion → YOLO → LLM → emergency dispatch over SIP trunk"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "Sentinel AI Contributors"},
]

dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.52",
    "python-dotenv>=1.2",
    "python-multipart>=0.0.32",
    "argon2-cffi>=25.1",
    "langchain>=1.3",
    "langchain-groq>=1.1",
    "langgraph>=1.2",
    "groq>=0.37",
    "edge-tts>=7.2",
    "elevenlabs>=2.65",
    "opencv-python>=4.14",
    "ultralytics>=8.4",
    "numpy>=2.5",
    "torch>=2.13",
    "torchvision>=0.28",
    "panoramisk>=1.4",
    "geopy>=2.5",
    "orjson>=3.12",
    "requests-toolbelt>=1.0",
    "psutil>=7.2",
    "tenacity>=9.1",
]

[tool.setuptools.packages.find]
include = ["api*", "core*", "services*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]